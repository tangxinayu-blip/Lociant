name: Build Android clone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android native build tools
        shell: bash
        run: |
          cargo install cargo-ndk --locked
          sdkManager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkManager" ]]; then
            sdkManager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$sdkManager"
          set +e
          set +o pipefail
          yes | "$sdkManager" --sdk_root="$ANDROID_SDK_ROOT" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'
          sdkStatus=${PIPESTATUS[1]}
          set -o pipefail
          set -e
          exit "$sdkStatus"

      - name: Install Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Configure Android SDK paths
        working-directory: apps/android
        shell: bash
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "$ANDROID_SDK_ROOT" "$FLUTTER_ROOT" > local.properties

      - name: Build clone with original accessibility flags
        working-directory: apps/android
        env:
          LOCIANT_CLONE: '1'
        run: bash gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: lociant-clone-original-flags-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
